workflows:
  android-release:
    name: CineViet Android APK Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Flutter clean/get
        script: |
          flutter clean
          flutter pub get
      - name: Build mobile/tablet APK
        script: flutter build apk --release --flavor mobile --build-name=1.0.2 --build-number=7055
      - name: Build Android TV/TV box APK
        script: flutter build apk --release --flavor tv --build-name=1.0.2 --build-number=7055
      - name: Collect APK artifacts
        script: |
          mkdir -p build/app/outputs/cineviet-release
          cp build/app/outputs/flutter-apk/app-mobile-release.apk build/app/outputs/cineviet-release/CineViet-Mobile-Tablet-1.0.2+7055.apk
          cp build/app/outputs/flutter-apk/app-tv-release.apk build/app/outputs/cineviet-release/CineViet-Android-TV-1.0.2+7055.apk
    artifacts:
      - build/app/outputs/cineviet-release/*.apk
      - build/app/outputs/flutter-apk/*.apk

  ios-release:
    name: CineViet iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_connect
      vars:
        BUNDLE_ID: "live.cineviet.cinevietios"
    scripts:
      - name: Flutter clean/get
        script: |
          flutter clean
          flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign
      - name: Package unsigned IPA for ESign
        script: |
          rm -rf build/ios/unsigned_ipa
          mkdir -p build/ios/unsigned_ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned_ipa/Payload/
          cd build/ios/unsigned_ipa
          zip -yr CineViet-unsigned.ipa Payload
    artifacts:
      - build/ios/unsigned_ipa/CineViet-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - cineviet.live@gmail.com
        notify:
          success: true
          failure: true

  windows-release:
    name: CineViet Windows Release
    max_build_duration: 60
    instance_type: windows_x2
    environment:
      flutter: stable
      vars:
        WINDOWS_ZIP_NAME: "CineViet-Windows-1.0.2.zip"
    scripts:
      - name: Enable Windows desktop
        script: flutter config --enable-windows-desktop
      - name: Flutter clean/get
        script: |
          flutter clean
          flutter pub get
      - name: Build Windows release
        script: flutter build windows --release --build-name=1.0.2 --build-number=7055
      - name: Package Windows portable zip
        script: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Copy-Item scripts\register_windows_protocol.ps1 build\windows\x64\runner\Release\Register-CineViet-Google-Login.ps1 -Force; New-Item -ItemType Directory -Force build\windows\package | Out-Null; Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\package\$env:WINDOWS_ZIP_NAME -Force"
    artifacts:
      - build/windows/package/CineViet-Windows-1.0.2.zip
      - build/windows/x64/runner/Release/**
